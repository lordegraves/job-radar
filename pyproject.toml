[build-system]
requires = ["setuptools>=70.0"]
build-backend = "setuptools.build_meta"

[project]
name = "job-radar"
version = "0.1.0"
description = "junior: local-first job discovery, triage, reporting, and application tracking"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "flask>=3.0.0",
    "keyring>=25.7.0",
    "pypdf>=5.0.0",
    "python-docx>=1.1.0",
    "pyyaml>=6.0.0",
    "requests>=2.31.0",
]

[project.optional-dependencies]
dev = [
    "build>=1.2.0",
    "pytest>=8.0.0",
]

[project.scripts]
job-radar = "job_radar.cli:main"
job-radar-web = "job_radar.web_app:main"

[project.gui-scripts]
job-radar-desktop = "job_radar.desktop_launcher:main"

[tool.setuptools.packages.find]
include = ["job_radar*"]

[tool.setuptools.package-data]
job_radar = [
    "bootstrap_defaults/*.yaml",
    "reference_data/*.json",
    "static/*.ico",
    "static/*.png",
    "templates/*.html",
    "templates/administration/*.html",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "job-radar"
version = "0.2.0"
description = "junior: local-first job discovery, triage, reporting, and application tracking"
readme = "README.md"
license = "GPL-3.0-only"
license-files = [
    "LICENSE",
    "PRIVACY.md",
    "SECURITY.md",
    "THIRD_PARTY_LICENSES.md",
    "dependency-license-report.json",
    "third_party/*.txt",
]
requires-python = ">=3.11"
dependencies = [
    "flask>=3.0.0",
    "keyring>=25.7.0",
    "pypdf>=5.0.0",
    "pywebview>=6.2.1,<7",
    "python-docx>=1.1.0",
    "pyyaml>=6.0.0",
    "requests>=2.31.0",
]

[project.optional-dependencies]
dev = [
    "build>=1.2.0",
    "pyinstaller>=6.10,<7",
    "pytest>=8.0.0",
]

[project.scripts]
junior = "job_radar.cli:main"
junior-scheduled = "job_radar.scheduled_scan:main"
junior-backup = "job_radar.scheduled_backup:main"
junior-web = "job_radar.web_app:main"
# Released aliases remain available so existing automation keeps working.
job-radar = "job_radar.cli:main"
job-radar-scheduled = "job_radar.scheduled_scan:main"
job-radar-backup = "job_radar.scheduled_backup:main"
job-radar-web = "job_radar.web_app:main"

[project.gui-scripts]
junior-desktop = "job_radar.desktop_launcher:main"
# Keep the released launcher alias for upgrades and existing shortcuts.
job-radar-desktop = "job_radar.desktop_launcher:main"

[tool.setuptools.packages.find]
include = ["job_radar*"]

[tool.setuptools.package-data]
job_radar = [
    "bootstrap_defaults/*.yaml",
    "reference_data/*.json",
    "static/*.ico",
    "static/*.png",
    "templates/*.html",
    "templates/administration/*.html",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
# Validation runs deliberately leave disposable package copies under
# testtmp-* when a failure needs inspection. Lint the maintained source and
# tests, not those frozen diagnostic copies.
extend-exclude = ["testtmp-*"]

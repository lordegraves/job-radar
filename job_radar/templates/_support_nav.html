{# Keep configuration, guidance, and troubleshooting visibly connected. #}
<nav class="workspace-tabs" aria-label="Help, settings, and system health">
    <a href="{{ url_for('settings_about') }}"{% if request.endpoint == 'settings_about' %} aria-current="page"{% endif %}>Help</a>
    <a href="{{ url_for('settings') }}"{% if request.endpoint == 'settings' %} aria-current="page"{% endif %}>Settings</a>
    <a href="{{ url_for('settings_diagnostics') }}"{% if request.endpoint in ['settings_diagnostics', 'settings_scan_diagnostics', 'settings_diagnostic_log', 'settings_job_platforms'] %} aria-current="page"{% endif %}>System Health</a>
</nav>

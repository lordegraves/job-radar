<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <title>Edit Tracker Application</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            line-height: 1.4;
            margin: 24px;
            max-width: 900px;
        }

        label {
            display: block;
            font-weight: bold;
            margin-top: 14px;
        }

        input,
        textarea {
            box-sizing: border-box;
            width: 100%;
            padding: 8px;
        }

        textarea {
            min-height: 120px;
        }

        code {
            background: #f6f8fa;
            padding: 2px 4px;
        }

        .actions {
            margin-top: 18px;
        }
    </style>
</head>

<body>
    <h1>Edit Application</h1>

    <p><strong>Company:</strong> {{ application.company_name }}</p>
    <p><strong>Role:</strong> {{ application.role_title }}</p>
    <p><strong>Workflow:</strong> {{ workflow_state }}</p>
    <p><strong>Job Radar ID:</strong> <code>{{ application.job_radar_id }}</code></p>

    {% if application.source_url %}
    <p><strong>Posting:</strong> <a href="{{ application.source_url }}">View posting</a></p>
    {% endif %}

    <form method="post">
        <input type="hidden" name="return_filter" value="{{ return_filter }}">

        <label for="status">Status</label>
        <input id="status" name="status" value="{{ application.status }}" required>

        <label for="follow_up_on">Follow-up date</label>
        <input id="follow_up_on" name="follow_up_on" value="{{ application.follow_up_on or '' }}"
            placeholder="YYYY-MM-DD">

        <label for="applied_on">Applied date</label>
        <input id="applied_on" name="applied_on" value="{{ application.applied_on or '' }}" placeholder="YYYY-MM-DD">

        <label for="last_activity_on">Last activity date</label>
        <input id="last_activity_on" name="last_activity_on" value="{{ application.last_activity_on or '' }}"
            placeholder="YYYY-MM-DD">

        <label for="outcome">Outcome</label>
        <input id="outcome" name="outcome" value="{{ application.outcome or '' }}">

        <label for="notes">Notes</label>
        <textarea id="notes" name="notes">{{ application.notes or '' }}</textarea>

        <div class="actions">
            <button type="submit">Save</button>
            <a href="{{ url_for('tracker', filter=return_filter) }}">Cancel</a>
        </div>
    </form>
</body>

</html>

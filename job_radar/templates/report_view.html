{% extends "base.html" %}

{% block title %}Report Viewer - Job Radar{% endblock %}

{% block page_styles %}
<style>
    iframe {
        background: #ffffff;
        border: 1px solid var(--border);
        border-radius: 10px;
        height: 80vh;
        width: 100%;
    }

    .viewer-actions {
        margin: 16px 0;
    }
</style>
{% endblock %}

{% block content %}
<div class="page-card">
    <h1 class="page-title">Report Viewer</h1>

    <p><strong>Viewing:</strong> <code>{{ report_name }}</code></p>

    <div class="viewer-actions">
        <a href="{{ url_for('reports') }}">Back to Reports</a>
    </div>
</div>

<iframe src="{{ report_url }}" title="Report file"></iframe>
{% endblock %}

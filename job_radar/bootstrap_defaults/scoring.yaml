# Occupation-neutral scoring structure copied into a new user's data directory.
#
# Managed profiles own their scoring rules. The Profile / Resume workflow and
# job-fit preference board add profile-specific terms without inheriting another
# user's occupation, location, experience gaps, or exclusions.
positive_keywords: {}

negative_keywords: {}

location_preferences:
  allowed: {}
  conditional: {}
  skipped: {}

top_matches:
  min_score: 120
  excluded_title_keywords: []
  strong_signals: []
  review_signals: []

review_needed:
  min_score: 100
  excluded_location_statuses:
    - skipped
    - unknown
  strong_signals: []

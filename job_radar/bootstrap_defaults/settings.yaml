# Safe first-run paths and disabled-by-default email settings for a new user.
database_path: data/job_radar.sqlite3
reports_path: reports
logs_path: logs

retention:
  report_policy: keep_last_n
  report_count: 10
  log_policy: latest_only
  log_count: 1

company_discovery:
  external_lookup: false

# Optional external advisory is off until the user reviews and accepts the
# privacy warning, then stores an API key in the OS credential manager.
llm:
  enabled: false
  provider: openai
  model: gpt-5.6-sol
  credential_key: ""
  privacy_acknowledged: false
  max_reviews_per_scan: 25

email:
  enabled: false
  sender: ""
  sender_name: "Junior"
  recipients: []
  smtp_host: ""
  smtp_port: 587
  smtp_username: ""
  smtp_password_env: ""
  smtp_credential_key: ""
  smtp_provider: "custom"
  smtp_tls_mode: "starttls"

name: Secret scanning

on:
  pull_request:
    branches:
      - main
      - feature/productization-foundation
  push:
    branches:
      - main
      - feature/productization-foundation
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: Gitleaks history scan
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out complete Git history
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install verified Gitleaks release
        shell: bash
        run: |
          set -euo pipefail

          gitleaks_version="8.30.1"
          archive="gitleaks_${gitleaks_version}_linux_x64.tar.gz"
          expected_sha256="551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
          download_url="https://github.com/gitleaks/gitleaks/releases/download/v${gitleaks_version}/${archive}"
          install_dir="${RUNNER_TEMP}/gitleaks"

          mkdir -p "${install_dir}"

          curl \
            --fail \
            --location \
            --silent \
            --show-error \
            --output "${RUNNER_TEMP}/${archive}" \
            "${download_url}"

          echo "${expected_sha256}  ${RUNNER_TEMP}/${archive}" | sha256sum --check -

          tar \
            --extract \
            --gzip \
            --file "${RUNNER_TEMP}/${archive}" \
            --directory "${install_dir}" \
            gitleaks

          chmod +x "${install_dir}/gitleaks"
          echo "${install_dir}" >> "${GITHUB_PATH}"

      - name: Show Gitleaks version
        shell: bash
        run: gitleaks version

      - name: Scan reachable Git history
        shell: bash
        run: |
          set -uo pipefail

          report_path="${RUNNER_TEMP}/gitleaks-report.json"

          set +e
          gitleaks git \
            --log-opts="--all" \
            --redact \
            --no-banner \
            --report-format=json \
            --report-path="${report_path}" \
            .
          gitleaks_exit_code=$?
          set -e

          if [ "${gitleaks_exit_code}" -eq 0 ]; then
            rm -f "${report_path}"
            exit 0
          fi

          if [ -s "${report_path}" ]; then
            compact_report="$(tr -d '[:space:]' < "${report_path}")"

            if [ "${compact_report}" != "[]" ]; then
              rm -f "${report_path}"
              echo "::error title=Likely secret detected::Gitleaks found one or more likely secrets in reachable Git history. Review the redacted finding metadata above. Do not paste the suspected secret into an issue, pull request, or chat."
              exit 1
            fi
          fi

          rm -f "${report_path}"
          echo "::error title=Gitleaks scan failed::Gitleaks could not complete the history scan. Review the scanner output above for an installation, Git-history, or execution problem."
          exit "${gitleaks_exit_code}"

name: Build and Sign Windows Release

on:
  workflow_dispatch:
    inputs:
      submit-to-signpath:
        description: Submit the validated installer to the configured SignPath project
        required: true
        type: boolean
        default: false

permissions:
  actions: read
  contents: read

jobs:
  build:
    name: Validate and build unsigned installer
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Set up Python 3.13
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.13"

      - name: Install reviewed build dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip

          $licenseReport = Get-Content dependency-license-report.json -Raw |
              ConvertFrom-Json
          $constraintsPath = Join-Path $env:RUNNER_TEMP "runtime-constraints.txt"
          $licenseReport.packages |
              ForEach-Object { "$($_.name)==$($_.version)" } |
              Set-Content -Path $constraintsPath -Encoding utf8

          python -m pip install --constraint $constraintsPath -e ".[dev]"
          python -m pip install ruff==0.15.21
          choco install innosetup --version=6.4.3 -y --no-progress

      - name: Validate release source
        shell: pwsh
        run: |
          python -m ruff check .
          python -m pytest -q tests
          python scripts/audit_dependency_licenses.py --check
          git diff --check

      - name: Build Windows installer
        shell: pwsh
        run: .\scripts\build_windows_installer.ps1

      - name: Upload unsigned installer
        id: upload-unsigned
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: junior-windows-unsigned
          path: artifacts/installer/Junior-Setup-0.2.0-RC6-build-1.24.exe
          if-no-files-found: error
          retention-days: 7

      - name: Verify SignPath configuration
        if: inputs['submit-to-signpath']
        shell: pwsh
        env:
          SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
          SIGNPATH_ORGANIZATION_ID: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          SIGNPATH_PROJECT_SLUG: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          SIGNPATH_SIGNING_POLICY_SLUG: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          SIGNPATH_ARTIFACT_CONFIGURATION_SLUG: ${{ vars.SIGNPATH_ARTIFACT_CONFIGURATION_SLUG }}
        run: |
          $required = @(
              "SIGNPATH_API_TOKEN",
              "SIGNPATH_ORGANIZATION_ID",
              "SIGNPATH_PROJECT_SLUG",
              "SIGNPATH_SIGNING_POLICY_SLUG",
              "SIGNPATH_ARTIFACT_CONFIGURATION_SLUG"
          )
          $missing = $required | Where-Object {
              [string]::IsNullOrWhiteSpace((Get-Item "Env:$_").Value)
          }
          if ($missing) {
              throw "SignPath repository configuration is incomplete: $($missing -join ', ')"
          }

      - name: Submit signing request
        if: inputs['submit-to-signpath']
        uses: signpath/github-action-submit-signing-request@c92b958760219087e01f8d67a1669ed57afe2627 # v2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_ARTIFACT_CONFIGURATION_SLUG }}
          github-artifact-id: ${{ steps.upload-unsigned.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: artifacts/signed

      - name: Upload signed installer
        if: inputs['submit-to-signpath']
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: junior-windows-signed
          path: artifacts/signed/**
          if-no-files-found: error
          retention-days: 30

# Occupation-neutral development and legacy fallback scoring.
#
# Managed profiles own their actual scoring rules. Keep this file neutral so a
# source checkout or an incomplete legacy setup cannot inherit one user's job
# family, locations, exclusions, or recommendation assumptions.
positive_keywords: {}

negative_keywords: {}

location_preferences:
  allowed: {}
  conditional: {}
  skipped: {}

top_matches:
  min_score: 120
  excluded_title_keywords: []
  strong_signals: []
  review_signals: []

review_needed:
  min_score: 100
  excluded_location_statuses:
    - skipped
    - unknown
  strong_signals: []
